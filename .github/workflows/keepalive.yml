# Keep the Streamlit Community Cloud dashboard from hibernating.
#
# The free tier sleeps an app after a stretch without traffic, and visitors then
# land on "This app has gone to sleep due to inactivity". This job visits the app
# with a real browser every few hours (and wakes it if it already dozed off).
#
# Set the target once, no secret needed since the URL is public:
#   gh variable set APP_URL --body https://<app>.streamlit.app
#
# Caveat: GitHub disables scheduled workflows after 60 days without repository
# activity. It emails first, and one click re-enables them.
name: keepalive

on:
  schedule:
    # Every six hours, offset off the hour to dodge the peak of cron traffic.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Visit the dashboard
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python .github/scripts/keepalive.py

      - name: Upload what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot
          path: keepalive.png
          if-no-files-found: warn
          retention-days: 7
